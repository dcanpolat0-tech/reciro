name: AI Validation

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'automation/**'

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Expo config check
        run: npm run check:config

      - name: Expo doctor
        run: npm run check:doctor

      - name: iOS export check
        run: npm run check:ios-export
